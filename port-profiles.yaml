# port-profiles.yaml — per-port open profiles for /ports/ (M-312).
# Saved by the page (PUT /ports/v1/profile/<port>); hand-editing is fine too.
# `open`: auto | public | tailnet | wildcard | embed. Ports without an entry
# use built-in defaults (open: auto, path: /).
profiles:
  3701:   # Multica (SPA): public hostname in a new tab.
    label: Multica
    scheme: http
    path: /
    open: public
    newtab: true
    pinned: false
  9090:   # Cockpit: X-Frame-Options/CSP forbid embedding; public host only.
    label: Cockpit
    scheme: https
    path: /
    open: public
    newtab: true
    pinned: false
  3181:   # DSH-X (SPA): public hostname in a new tab.
    label: DSH-X
    scheme: http
    path: /
    open: public
    newtab: true
    pinned: false

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ports — portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Ports</h1>
  <p class="sub">Open any local port. Bookmarks like <code>#/3701</code> reload and share.</p>
  <form id="search" autocomplete="off">
    <input id="q" type="text" placeholder="port:3701 · :3701 · 3701 or name" autofocus
           aria-label="port search" enterkeyhint="go">
    <button type="submit">Open</button>
  </form>
  <ul id="results" class="results" role="listbox" aria-label="search results"></ul>
  <p id="msg" class="msg" role="status"></p>
</header>
<main id="stage" class="stage">
  <div id="empty" class="empty">
    <p>Type a port above, or open <code>#/&lt;port&gt;</code> directly.</p>
    <p class="hint">Examples: <a href="#/3701">Multica :3701</a> · <a href="#/9090">Cockpit :9090</a></p>
  </div>
  <section id="viewer" class="viewer" hidden>
    <div class="bar">
      <strong id="vtitle">:—</strong>
      <span id="vvia" class="via"></span>
      <span id="vwarn" class="warn" hidden></span>
      <button id="vnewtab" type="button">Open in new tab</button>
      <button id="vprofile" type="button" aria-expanded="false">Profile</button>
    </div>
    <p id="vrefuse" class="refuse" hidden></p>
    <iframe id="vframe" title="embedded port" hidden></iframe>
  </section>
  <section id="prof" class="prof" hidden>
    <h2>Profile for :<span id="pport">—</span></h2>
    <label>Label <input id="plabel" type="text" maxlength="80"></label>
    <label>Scheme
      <select id="pscheme"><option value="http">http</option><option value="https">https</option></select>
    </label>
    <label>Path <input id="ppath" type="text" placeholder="/" maxlength="200"></label>
    <label>Open mode
      <select id="popen">
        <option value="auto">auto (tailnet → public → wildcard → embed)</option>
        <option value="public">public (hostname, new tab)</option>
        <option value="tailnet">tailnet (tailscale serve, new tab)</option>
        <option value="wildcard">wildcard (p&lt;port&gt; hostname, new tab)</option>
        <option value="embed">embed (path proxy here, may not render)</option>
      </select>
    </label>
    <label class="check"><input id="pnewtab" type="checkbox" checked> Open links in a new tab</label>
    <p class="row">
      <button id="psave" type="button">Save</button>
      <button id="pdelete" type="button">Reset to defaults</button>
      <span id="pmsg" class="msg" role="status"></span>
    </p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>

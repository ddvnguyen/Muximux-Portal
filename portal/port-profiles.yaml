# port-profiles.yaml — per-port open profiles for /ports/ (M-312 respec).
# Saved by the page (PUT /ports/v1/profile/<port>); hand-editing is fine too.
# `open`: auto | tailnet | public | embed. `tailnet_url`: Tailscale Services
# hostname (provisioned by the Owner step); empty until then. `spa`: needs
# tailnet or public host, warns up front in the path proxy.
profiles:
  3701:
    label: Multica
    scheme: http
    host: 127.0.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
  9090:
    label: Cockpit
    scheme: https
    host: 127.0.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
  3181:
    label: DSH-X
    scheme: http
    host: 127.0.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
  3180:
    label: DSH-Z
    scheme: http
    host: 10.88.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
    source: loopback  # M-379: dsh-claude trustedRequest needs a loopback peer (dsh-z binds 10.88.0.1)
    loopback_map: [18791]  # M-372: billion-context __BILI__.origin (http://127.0.0.1:18791)
  4096:
    label: opencode
    scheme: http
    host: 127.0.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
  4320:
    label: Freebuff Desktop
    scheme: http
    host: 127.0.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
  3000:
    label: Grafana
    scheme: http
    host: 127.0.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
  3190:
    label: MMX PWA
    scheme: http
    host: 127.0.0.1
    path: /
    open: auto
    newtab: false
    pinned: false
    tailnet_url: ""
    spa: true
    origin: rewrite
    # M-421: document HTML stays out of the cache. Measured on the live lane
    # 2026-11-19: GET /p/3190/ -> 200 with
    #   Cache-Control: private, no-cache, no-store, max-age=0, must-revalidate
    #   Set-Cookie: multica_auth, multica_csrf, multica_csrf_session, multica_logged_in
    # so `html_cacheable()` would refuse it anyway; leave the opt-in off and
    # cache only the hashed /_next/static build output. Flip to true only for
    # an app whose HTML is public and cacheable.
    pwa_cache: false
